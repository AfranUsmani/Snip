# ---------------------------------------------------------------------------
# Default profile: zero-infra local run (in-memory H2 + in-memory cache).
# Just `mvn spring-boot:run` — no database or Redis needed.
# ---------------------------------------------------------------------------
spring:
  application:
    name: url-shortener-api
  mvc:
    contentnegotiation:
      media-types:
        webmanifest: application/manifest+json
  datasource:
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # Batch multi-row writes (e.g. the bulk endpoint) into fewer round-trips.
      hibernate.jdbc.batch_size: 30
      hibernate.order_inserts: true
      hibernate.order_updates: true
  cache:
    type: simple
  h2:
    console:
      # Never expose the H2 web console on a public instance (it can read files
      # and run scripts). Off by default; enable locally only if you need it.
      enabled: false
  web:
    resources:
      cache:
        # Let browsers reuse dashboard assets, with cheap 304 revalidation so a
        # redeploy still serves fresh JS/CSS.
        cachecontrol:
          max-age: 600
          cache-public: true
        use-last-modified: true

app:
  # Optional. Leave empty and the public host is derived from each request, so
  # short URLs are correct on localhost, Render, or any custom domain with no
  # config. Set it only to force a specific host (e.g. a branded domain).
  base-url: ${APP_BASE_URL:}
  safe-browsing:
    # Optional. Set SAFE_BROWSING_API_KEY to screen destinations against Google
    # Safe Browsing (free for non-commercial use). Unset = screening disabled.
    api-key: ${SAFE_BROWSING_API_KEY:}
  rate-limit:
    # Per-IP token bucket on the write + QR endpoints (redirects are never
    # limited), so a public no-auth instance can't be scripted for abuse.
    capacity: ${RATE_LIMIT_CAPACITY:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

server:
  # Cloud platforms (Render, Cloud Run, Koyeb, ...) inject the port via $PORT.
  port: ${PORT:8080}
  # Honor X-Forwarded-* from the platform's TLS-terminating proxy so the
  # request-derived base URL reflects https://<public-host>, not the internal
  # http://<container>:<port>.
  forward-headers-strategy: framework
  # Gzip text responses (HTML/CSS/JS + JSON API payloads) to cut transfer time.
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false   # no Redis in the default profile

logging:
  pattern:
    # Prepend the per-request correlation id (set by RequestIdFilter) to each log line.
    level: "%5p [%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# ---------------------------------------------------------------------------
# Docker profile: production-like stack (PostgreSQL + Redis cache).
# Activated via SPRING_PROFILES_ACTIVE=docker (see docker-compose.yml).
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    # DB_PARAMS appends connection options, e.g. ?sslmode=require for a hosted
    # Postgres such as Neon or Supabase (durable free storage that survives restarts).
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:urlshortener}${DB_PARAMS:}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  base-url: ${APP_BASE_URL:}

management:
  health:
    redis:
      enabled: true
